server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para carregamento ultrarrápido no celular
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Suporte a SPA (Single Page Application) e Web Share Target
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Cache para recursos estáticos com hash
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Desativar cache para manifest e service worker para garantir updates instantâneos do PWA
    location ~* (?:manifest\.json|sw\.js)$ {
        include /etc/nginx/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        include /etc/nginx/security-headers.conf;
        root /usr/share/nginx/html;
    }
}
