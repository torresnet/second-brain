name: Deploy Automático (Coolify)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Disparar Deploy no Coolify
    runs-on: ubuntu-latest
    steps:
      - name: Chamar API do Coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          case "$COOLIFY_URL" in
            https://*) ;;
            *) echo "❌ COOLIFY_URL deve começar com https:// (o token não pode trafegar sem TLS)"; exit 1 ;;
          esac
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "❌ Defina os secrets COOLIFY_API_TOKEN, COOLIFY_URL e COOLIFY_APP_UUID"
            exit 1
          fi

          response=$(curl -s --proto '=https' --tlsv1.2 -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\":\"${COOLIFY_APP_UUID}\",\"force\":false}" \
            "${COOLIFY_URL%/}/api/v1/deploy")

          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)

          if [ "$status" -eq 200 ] || [ "$status" -eq 201 ]; then
            echo "✅ Deploy enfileirado com sucesso no Coolify!"
          else
            echo "❌ Falha ao enfileirar deploy (HTTP $status)"
            exit 1
          fi
